name: MuleSoft CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Deploy PR Builds OR Manual Runs
  # -------------------------------------------------------------
  deploy-pr-or-manual:
    name: Build & Deploy (PR / Manual)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Publish to Exchange and Deploy to CloudHub 2.0
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          # 1. Publish artifact to Anypoint Exchange
          mvn clean deploy \
            -s .maven/settings.xml \
            -DskipMuleDeploy \
            -DskipTests

          # 2. Deploy published asset from Exchange to CloudHub 2.0
          mvn mule:deploy \
            -s .maven/settings.xml \
            -DskipTests

  # -------------------------------------------------------------
  # Merged to Main (Release, Tag, Deploy & Increment POM)
  # -------------------------------------------------------------
  release-and-bump-main:
    name: Release, Deploy & Increment Version (Merged to Main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set Release Version (Strip -SNAPSHOT)
        run: |
          # Read current version from pom.xml
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Remove -SNAPSHOT suffix (e.g., 1.0.0-SNAPSHOT -> 1.0.0)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          
          # Update pom.xml to release version
          mvn versions:set -DnewVersion=$RELEASE_VERSION -DgenerateBackupPoms=false

      - name: Publish Release to Exchange and Deploy to CloudHub 2.0
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          # 1. Publish Release asset to Anypoint Exchange
          mvn clean deploy \
            -s .maven/settings.xml \
            -DskipMuleDeploy \
            -DskipTests

          # 2. Deploy the Release asset to CloudHub 2.0
          mvn mule:deploy \
            -s .maven/settings.xml \
            -DskipTests

      - name: Create Git Release Tag
        run: |
          git tag -a "v${{ env.RELEASE_VERSION }}" -m "Release v${{ env.RELEASE_VERSION }}"
          git push origin "v${{ env.RELEASE_VERSION }}"

      - name: Increment POM to Next Snapshot Version
        run: |
          # Increment version and re-attach -SNAPSHOT (e.g., 1.0.0 -> 1.0.1-SNAPSHOT)
          mvn versions:set -DnextSnapshot=true -DgenerateBackupPoms=false
          NEXT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          # Commit the new snapshot version back to main
          git add pom.xml
          git commit -m "chore(release): bump version to $NEXT_VERSION [skip ci]"
          git push origin main
